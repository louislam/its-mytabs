services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: its-mytabs:local
        ports:
            # Host Port:Container Port
            - "47777:47777"
        # Fedora&Podman specific
        security_opt:
            - label=disable
        environment:
            MYTABS_DISABLE_AUTH: "true"
        volumes:
            # Host Path:Container Path
            - ./data:/app/data
        restart: unless-stopped
