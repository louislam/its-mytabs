name: e2e-debug
# TEMP: fast iteration job for the failing webkit specs. Delete after use.
on:
    push:
        branches:
            - dev-default
    workflow_dispatch:

jobs:
    e2e-webkit:
        runs-on: macos-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Install frontend dependencies
              run: deno task install-deps

            - name: Install Playwright browser
              run: cd frontend && deno run -A npm:@playwright/test install --with-deps webkit

            - name: Run e2e
              env:
                  MYTABS_SKIP_YOUTUBE: 1
              run: cd frontend && deno run -A npm:@playwright/test test --project=webkit frontend/e2e/home.spec.ts frontend/e2e/audio-sources.spec.ts --repeat-each=3
