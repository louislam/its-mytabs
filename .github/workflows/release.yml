name: Release

# Release a new version: build the Windows binary, push the Docker image
# (Docker Hub + GHCR), then bump deno.jsonc, tag and create the GitHub release.
#
# Usage: Actions -> Release -> Run workflow, enter the version (e.g. 1.8.0).
# The version must be plain semver and greater than the latest version.
# `steps` re-runs one part only, e.g. `docker` to re-push an image.
#
# Every step is a thin wrapper around extra/release.ts, so the same release
# can be run locally when Actions is unavailable: deno task release 1.8.0

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Version to release (MAJOR.MINOR.PATCH, e.g. 1.8.0). Must be greater than the latest version"
                required: true
                type: string
            steps:
                description: "Which steps to run"
                required: false
                type: choice
                options:
                    - all
                    - check
                    - windows
                    - docker
                    - publish
                default: all

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: write
    packages: write

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            dockerhub: ${{ steps.version.outputs.dockerhub }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  # Tags are needed to compare against the latest version
                  fetch-depth: 0

            - name: Set up Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Validate version
              if: inputs.steps == 'all' || inputs.steps == 'check'
              env:
                  VERSION: ${{ inputs.version }}
              run: deno run --allow-all extra/release.ts "$VERSION" --check

            - name: Detect Docker Hub credentials
              id: version
              env:
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
              run: |
                  echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
                  if [ -n "$DOCKERHUB_TOKEN" ]; then
                      echo "dockerhub=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "dockerhub=false" >> "$GITHUB_OUTPUT"
                  fi

    build-windows:
        needs: prepare
        if: inputs.steps == 'all' || inputs.steps == 'windows'
        runs-on: windows-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Build Windows zip
              run: deno run --allow-all extra/release.ts "${{ needs.prepare.outputs.version }}" --windows

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: windows
                  path: its-mytabs-v${{ needs.prepare.outputs.version }}-windows.zip
                  if-no-files-found: error

    release-docker:
        needs: prepare
        if: inputs.steps == 'all' || inputs.steps == 'docker'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  # GITHUB_TOKEN cannot write a package that is not linked to this repo
                  username: ${{ secrets.GHCR_USERNAME || github.actor }}
                  password: ${{ secrets.GHCR_TOKEN || github.token }}

            - name: Log in to Docker Hub
              if: needs.prepare.outputs.dockerhub == 'true'
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push Docker image
              env:
                  # Docker Hub first, then GHCR
                  RELEASE_REPO_NAMES: ${{ needs.prepare.outputs.dockerhub == 'true' && format('{0}/its-mytabs,ghcr.io/{1}', github.repository_owner, github.repository) || format('ghcr.io/{0}', github.repository) }}
              run: deno run --allow-all extra/release.ts "${{ needs.prepare.outputs.version }}" --docker

    publish:
        needs: [prepare, build-windows, release-docker]
        if: ${{ !cancelled() && !failure() && (inputs.steps == 'all' || inputs.steps == 'publish') }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Download Windows artifact
              uses: actions/download-artifact@v4
              with:
                  name: windows

            - name: Bump, tag and create the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  deno run --allow-all extra/release.ts "${{ needs.prepare.outputs.version }}" --publish
