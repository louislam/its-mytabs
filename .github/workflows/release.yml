name: Release

# Release a new version: build the Windows binary, push the Docker image
# (Docker Hub + GHCR), then bump deno.jsonc, tag and create the GitHub release.
#
# Usage: Actions -> Release -> Run workflow, enter the version (e.g. 1.8.0).
# The version must be plain semver and greater than the latest version/tag.

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Version to release (MAJOR.MINOR.PATCH, e.g. 1.8.0). Must be greater than the latest version"
                required: true
                type: string

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: write
    packages: write

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.validate.outputs.version }}
            dockerhub: ${{ steps.validate.outputs.dockerhub }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  # Tags are needed to compare against the latest version
                  fetch-depth: 0

            - name: Set up Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Validate version
              id: validate
              env:
                  VERSION: ${{ inputs.version }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
              run: |
                  deno run --allow-read --allow-run --allow-env extra/release-version.ts validate "$VERSION"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  if [ -n "$DOCKERHUB_TOKEN" ]; then
                      echo "dockerhub=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "dockerhub=false" >> "$GITHUB_OUTPUT"
                  fi

    build-windows:
        needs: prepare
        runs-on: windows-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Set version
              run: deno run --allow-read --allow-write extra/release-version.ts set ${{ needs.prepare.outputs.version }}

            - name: Install frontend dependencies
              run: deno task install-deps

            - name: Build binary
              run: deno task build-binary

            - name: Package
              shell: pwsh
              run: Compress-Archive -Path its-mytabs.exe -DestinationPath "its-mytabs-v${{ needs.prepare.outputs.version }}-windows.zip"

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: windows
                  path: its-mytabs-v${{ needs.prepare.outputs.version }}-windows.zip
                  if-no-files-found: error

    release-docker:
        needs: prepare
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Set version
              run: deno run --allow-read --allow-write extra/release-version.ts set ${{ needs.prepare.outputs.version }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}

            - name: Log in to Docker Hub
              if: needs.prepare.outputs.dockerhub == 'true'
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Install frontend dependencies
              run: deno task install-deps

            - name: Build and push image
              env:
                  # Docker Hub first, then GHCR (build-docker.ts tags 1, latest and the version)
                  RELEASE_REPO_NAMES: ${{ needs.prepare.outputs.dockerhub == 'true' && format('{0}/its-mytabs,ghcr.io/{1}', github.repository_owner, github.repository) || format('ghcr.io/{0}', github.repository) }}
              run: deno task build-frontend && deno run --allow-all extra/build-docker.ts

    publish:
        needs: [prepare, build-windows, release-docker]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Download Windows artifact
              uses: actions/download-artifact@v4
              with:
                  name: windows

            - name: Bump version
              run: deno run --allow-read --allow-write extra/release-version.ts set ${{ needs.prepare.outputs.version }}

            - name: Commit and tag
              env:
                  VERSION: ${{ needs.prepare.outputs.version }}
                  BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -am "Update to $VERSION"
                  git tag "$VERSION"
                  git push origin "HEAD:$BRANCH"
                  git push origin "refs/tags/$VERSION"

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ needs.prepare.outputs.version }}
              run: gh release create "$VERSION" --title "$VERSION" --verify-tag --generate-notes "its-mytabs-v$VERSION-windows.zip"
