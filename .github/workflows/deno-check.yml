name: Deno Check
on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    deno-check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - run: deno task check
            - run: deno task test

    e2e:
        needs: deno-check
        # A stuck browser install once blocked a run for 14 hours
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: ubuntu-latest, browser: chromium }
                    - { os: ubuntu-latest, browser: firefox }
                    - { os: macos-latest, browser: webkit }
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Install frontend dependencies
              run: deno task install-deps

            # Keep the .debs so `--with-deps` can reuse them instead of hitting the apt mirrors
            - name: Bound and cache apt
              if: runner.os == 'Linux'
              run: |
                  mkdir -p "$HOME/.apt-archives/partial"
                  chmod 777 "$HOME/.apt-archives/partial"
                  sudo tee /etc/apt/apt.conf.d/99-playwright-cache >/dev/null <<EOF
                  Dir::Cache::archives "$HOME/.apt-archives";
                  APT::Keep-Downloaded-Packages "true";
                  Acquire::Retries "3";
                  Acquire::http::Timeout "15";
                  Acquire::https::Timeout "15";
                  EOF
                  # The Azure node is the slow one; leave archive/security in the list
                  sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt || true

            - name: Compute weekly cache key
              id: week
              run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

            - name: Cache apt packages
              if: runner.os == 'Linux'
              uses: actions/cache@v6
              with:
                  path: ~/.apt-archives
                  key: apt-playwright-${{ runner.os }}-${{ steps.week.outputs.week }}
                  restore-keys: |
                      apt-playwright-${{ runner.os }}-

            - name: Cache Playwright browsers
              uses: actions/cache@v6
              with:
                  path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
                  key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.week.outputs.week }}
                  restore-keys: |
                      playwright-${{ runner.os }}-${{ matrix.browser }}-

            # Browsers come from Playwright's CDN, not apt, so they must not wait on a mirror
            - name: Install Playwright browser
              if: matrix.browser
              timeout-minutes: 10
              run: cd frontend && deno run -A npm:@playwright/test install ${{ matrix.browser }}

            # Mostly fonts on the runner image; never let the apt mirror block the tests
            - name: Install Playwright system deps
              if: matrix.browser
              timeout-minutes: 8
              continue-on-error: true
              run: cd frontend && deno run -A npm:@playwright/test install-deps ${{ matrix.browser }}

            # apt runs as root; the cache tar cannot read root-owned files
            - name: Hand the apt archives back to the cache
              if: always() && runner.os == 'Linux'
              run: sudo chown -R "$USER" "$HOME/.apt-archives"

            - name: Run e2e
              if: matrix.browser
              env:
                  # YouTube needs real network + the embed player; skip on CI
                  MYTABS_SKIP_YOUTUBE: 1
              run: cd frontend && deno run -A npm:@playwright/test test --project=${{ matrix.browser }}
