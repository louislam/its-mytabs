name: Deno Check
on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    deno-check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x
            - run: deno task check
            - run: deno task test

            - name: Install frontend dependencies
              run: deno task install-frontend-deps

            - name: Install Playwright browser
              run: cd frontend && deno run -A npm:@playwright/test install --with-deps chromium

            - run: deno task e2e
