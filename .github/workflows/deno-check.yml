name: Deno Check
on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    deno-check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x
            - run: deno task check
            - run: deno task test

            - name: Install frontend dependencies
              run: deno task install-frontend-deps

            - name: Install Playwright browsers (chromium + firefox)
              run: cd frontend && deno run -A npm:@playwright/test install --with-deps chromium firefox

            - run: deno task e2e-all -- --project=chromium --project=firefox

    e2e-webkit:
        runs-on: macos-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Install frontend dependencies
              run: deno task install-frontend-deps

            - name: Install Playwright webkit
              run: cd frontend && deno run -A npm:@playwright/test install webkit

            - name: Run e2e (webkit)
              run: deno task e2e-all -- --project=webkit
