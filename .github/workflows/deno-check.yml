name: Deno Check
on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    e2e:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: ubuntu-latest, browsers: "chromium firefox", projects: "--project=chromium --project=firefox", runChecks: true }
                    - { os: macos-latest, browsers: "webkit", projects: "--project=webkit", runChecks: false }
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            # Format/lint/type-check/unit tests only once (linux), they are OS-agnostic
            - name: Deno check & test
              if: matrix.runChecks
              run: |
                  deno task check
                  deno task test

            - name: Install frontend dependencies
              run: deno task install-frontend-deps

            - name: Install Playwright browsers
              run: cd frontend && deno run -A npm:@playwright/test install --with-deps ${{ matrix.browsers }}

            - name: Run e2e
              run: deno task e2e-all -- ${{ matrix.projects }}
