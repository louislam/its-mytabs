name: Deno Check
on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    e2e:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: ubuntu-latest, browser: chromium, runChecks: true }
                    - { os: ubuntu-latest, browser: firefox, runChecks: false }
                    - { os: macos-latest, browser: webkit, runChecks: false }
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            # Format/lint/type-check/unit tests only once (the chromium entry)
            - name: Deno check & test
              if: matrix.runChecks
              run: |
                  deno task check
                  deno task test

            - name: Install frontend dependencies
              run: deno task install-frontend-deps

            - name: Install Playwright browser
              if: matrix.browser
              run: cd frontend && deno run -A npm:@playwright/test install --with-deps ${{ matrix.browser }}

            - name: Run e2e
              if: matrix.browser
              run: deno task e2e-all -- --project=${{ matrix.browser }}
